<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - RAPZZZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background:#050510; color:#fff; font-family:'Outfit',sans-serif; padding:30px 20px; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; }
        .box { width:100%; max-width:400px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:25px; text-align:center; }
        h1 { font-size:20px; color:#ff007f; margin-bottom:20px; }
        input { width:100%; padding:15px; border-radius:10px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.5); color:#fff; margin-bottom:15px; outline:none; text-align:center; font-size:16px; letter-spacing:2px; }
        button { width:100%; padding:15px; border:none; border-radius:10px; background:linear-gradient(135deg, #ff007f, #9d00ff); color:#fff; font-weight:800; cursor:pointer; font-size:14px; }
        button:hover { opacity:0.9; }
        .panel { display:none; text-align:left; }
        .panel.active { display:block; }
        .group { margin-bottom:20px; background:rgba(0,0,0,0.3); padding:15px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); }
        .group label { font-size:12px; color:#aaa; display:block; margin-bottom:8px; }
        .btn-toggle { background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.2); padding:10px; border-radius:8px; font-size:12px; cursor:pointer; margin-right:5px; }
        .btn-toggle.aktif { background:#25D366; border-color:#25D366; }
        .info { font-size:11px; color:#aaa; margin-top:5px; line-height:1.5; }
        a { display:inline-block; margin-top:20px; font-size:12px; color:#ffcc00; text-decoration:none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔐 Admin RAPZZZ</h1>
        
        <!-- LOGIN FORM -->
        <div id="loginForm">
            <input type="password" id="pinInput" placeholder="Masukkan PIN Rahasia" maxlength="6">
            <button onclick="login()">Masuk Panel</button>
        </div>

        <!-- ADMIN PANEL -->
        <div id="adminPanel" class="panel">
            <div class="group">
                <label>Status Toko</label>
                <button class="btn-toggle" id="btnBuka" onclick="setStatus(true)">🟢 Buka</button>
                <button class="btn-toggle" id="btnTutup" onclick="setStatus(false)">🔴 Tutup</button>
            </div>

            <div class="group">
                <label>Pengumuman / Info (Tampil di Web)</label>
                <input type="text" id="infoInput" placeholder="Contoh: Promo diskon 10%!" onkeyup="simpanInfo()">
                <div class="info">Kosongkan jika tidak ada info.</div>
            </div>
            
            <button onclick="logout()" style="background:rgba(255,255,255,0.1); color:#ff8888; margin-top:10px;">Keluar</button>
            <a href="index.html">← Kembali ke Web Utama</a>
        </div>
    </div>

    <script>
        // ===== PIN RAHASIA =====
        const PIN_RAHASIA = "123456"; // GANTI ANGKA INI DENGAN PIN RAHASIA LO
        
        const SafeStore = {
            get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
            set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } }
        };

        // Cek apakah udah login sebelumnya
        window.onload = () => {
            if(SafeStore.get('rapzzz_admin_login', false)) {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminPanel').classList.add('active');
                loadData();
            }
        }

        function login() {
            const pin = document.getElementById('pinInput').value;
            if(pin === PIN_RAHASIA) {
                SafeStore.set('rapzzz_admin_login', true);
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminPanel').classList.add('active');
                loadData();
            } else {
                alert("PIN Salah! Akses Ditolak.");
            }
        }

        function logout() {
            SafeStore.set('rapzzz_admin_login', false);
            location.reload();
        }

        function loadData() {
            const isOpen = SafeStore.get('rapzzz_store_open', true);
            const info = SafeStore.get('rapzzz_info', '');
            setStatus(isOpen, false); // Load status tanpa save
            document.getElementById('infoInput').value = info;
        }

        function setStatus(isOpen, save = true) {
            if(save) {
                SafeStore.set('rapzzz_store_open', isOpen);
                if (navigator.vibrate) navigator.vibrate(50);
            }
            
            const btnBuka = document.getElementById('btnBuka');
            const btnTutup = document.getElementById('btnTutup');
            
            if(isOpen) {
                btnBuka.classList.add('aktif');
                btnTutup.classList.remove('aktif');
            } else {
                btnBuka.classList.remove('aktif');
                btnTutup.classList.add('aktif');
            }
        }

        function simpanInfo() {
            const info = document.getElementById('infoInput').value;
            SafeStore.set('rapzzz_info', info);
        }
    </script>
</body>
</html>
